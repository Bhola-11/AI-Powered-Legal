[tool.poetry]
name = "civiclaw"
version = "1.0.0"
description = "AI-Powered Legal Case Management & Court Workflow Platform"
authors = ["CivicLaw Team <engineering@civiclaw.local>"]
readme = "README.md"
packages = [{include = "apps"}]

[tool.poetry.dependencies]
python = "^3.11"
Django = "^5.0.0"
asgiref = "^3.7.0"
sqlparse = "^0.4.4"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-django = "^4.8.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
